<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas</title>
    <script type="module" src="./contas.js" defer ></script>
</head>
<body>
    <h1>Contas</h1>
    <menu>
        <form>
            <label for="pesquisa">Pesquisa:</label>
            <input type="text" id="pesquisa">
            <button id="pesquisar" aria-label="Pesquisar" >🔍</button>
        </form>
        <button id="novo">Novo</button>
    </menu>
    <dialog>
        <form method="dialog" >
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" minlength="2" maxlength="60" required />
            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" min="1" max="1000" required />
            <button id="salvar">Salvar</button>
            <button>Cancelar</button>
        </form>
    </dialog>
    <ul>
        <li>Internet - R$ 100.00</li>
    </ul>
    <div id="totalizacao" ></div>
</body>
</html>
