<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script type="module" defer src="src/index.js"></script>
</head>
<body>
    <header>
            <h1>Animes</h1>
            <input type="search" id="busca-anime" placeholder="Buscar anime...">
            <button id="adicionar">Adicionar</button>
    </header>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="animes"></tbody>
    </table>
    
    <dialog id="anime-dialog">
        <form method="dialog">
            <label for="anime-name">Nome do Anime:</label>
            <input type="text" id="anime-name" name="anime-name" required minlength="2" maxlength="100">
            <label for="anime-categorie">Categoria</label>
            <input type="text" id="anime-categorie" name="anime-categorie" required />
            <div class="dialog-actions">
                <button type="button" id="cancel-button">Cancelar</button>
                <button type="submit" id="botao-salvar">Salvar</button>
            </div>
        </form>
    </dialog>
    
</body>
</html>
