<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Atleta</title>
    <script src="cadastro.js" type="module"></script>
</head>
<body>
    <h1>Cadastro de Atleta</h1>
    <form>
        <label for="nome">Nome:</label> <input type="text" id="nome" />
        <label for="peso">Peso:</label> <input type="number" step="0.1" id="peso" />
        <label for="altura">Altura:</label> <input type="number" step="0.01" id="altura" />
        <button type="button" id="salvar">Salvar</button>
    </form>
</body>
</html>
