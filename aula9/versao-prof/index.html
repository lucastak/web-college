<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas</title>
    <script type="module" src="src/index.js" defer ></script>
    <style>
        input {
            display: block;
        }
        .selecionada {
            background-color: beige;
        }
        tbody {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Contas</h1>
    <menu>
        <button id="nova">Nova</button>
        <button id="alterar">Alterar</button>
        <button id="remover">Remover</button>
    </menu>
    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Descrição</th>
                <th>Tipo</th>
                <th>Valor (R$)</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr>
                <td colspan="3" ></td>
                <td id="saldo" ></td>
            </tr>
        </tfoot>
    </table>
    <template>
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </template>
    <dialog>
        <h2>Conta</h2>
        <form method="dialog" >
            <input type="hidden" id="id" />
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" minlength="2" maxlength="50" required />
            <label for="tipo">Tipo:</label>
            <fieldset id="tipo" >
                <input type="radio" name="tipo" id="pagar" checked /><label for="pagar">Pagar</label>
                <input type="radio" name="tipo" id="receber" /><label for="receber">Receber</label>
            </fieldset>
            <label for="valor">Valor:</label>
            <input type="number" id="valor" min="1" required />
            <button id="salvar" >Salvar</button>
            <button id="cancelar" >Cancelar</button>
        </form>
    </dialog>
</body>
</html>
