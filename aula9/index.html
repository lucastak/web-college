<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Gestão de Contas</h1>
        <menu class="actions-menu">
            <button id="nova" class="btn btn-primary">Nova Conta</button>
            <button id="alterar" class="btn btn-secondary" disabled>Alterar</button>
            <button id="remover" class="btn btn-danger" disabled>Remover</button>
        </menu>

        <div class="table-container">
            <table id="tabela-contas">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody id="contas">
                    
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" class="text-right"><strong>Saldo Total:</strong></td>
                        <td id="saldo" class="saldo-value">R$ 0.00</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </main>

    <dialog id="conta-dialog">
        <form id="conta-form" method="dialog">
            <h2 id="dialog-title">Nova Conta</h2>
            <input type="hidden" id="conta-id">
            
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required placeholder="Ex: Conta de Luz">
            </div>
            
            <div class="form-group">
                <label for="tipo">Tipo:</label>
                <select id="tipo" required>
                    <option value="">Selecione...</option>
                    <option value="pagar">Pagar</option>
                    <option value="receber">Receber</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" step="0.01" min="0.01" required placeholder="0.00">
            </div>
            
            <div class="dialog-actions">
                <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
                <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="./src/index.js"></script>
</body>
</html>
