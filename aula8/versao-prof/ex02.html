<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function imprimir( texto ) {
            return new Promise( ( resolve, reject ) => {
                console.log( texto );
                resolve(); // Cumpre a promessa, sem valor
            } );
        }

        imprimir( 'Oi' );
        console.log( 'Boa noite.' );
    </script>
</body>
