<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div></div>
    <script>
        fetch( 'frase.txt' )
            .then( response => {
                if ( ! response.ok ) {
                    throw new Error( 'Erro ao obter o arquivo.' );
                }
                return response.text(); // Conteúdo será retornado p/ o próximo then()
            } )
            .then( conteudo => {
                document.querySelector( 'div' ).textContent = conteudo;
            })
            .catch( error => {
                document.querySelector( 'div' ).textContent = error.message;
            } );
    </script>
</body>
</html>
